# Local PostgreSQL for manual runs. Tests do not need it: they start a throwaway cluster.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ledger_owner
      POSTGRES_PASSWORD: ledger
      POSTGRES_DB: ledger
    ports:
      - "5433:5432"
    volumes:
      - ./docker/init.sql:/docker-entrypoint-initdb.d/10-roles.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledger_owner -d ledger"]
      interval: 2s
      timeout: 2s
      retries: 30
