# Alembic configuration of tenant-projects. The database URL comes from TENANT_PROJECTS_DATABASE_URL (migrations/env.py);
# the value below is a credential-free fallback for `alembic ... --sql` (offline mode).
[alembic]
script_location = migrations
prepend_sys_path = src
file_template = %%(rev)s_%%(slug)s
sqlalchemy.url = postgresql+asyncpg://localhost:5432/tenant_projects

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
